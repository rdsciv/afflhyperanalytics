<head>

<style>/* AFFL Savant — design system (blueprint §9) */
:root{
  --canvas:#0a0d13; --card:#0e1119; --card2:#111624; --rule:#1c2536;
  --blue:#00a2ff; --orange:#ff6a00; --lime:#c8ff00; --yellow:#ffc400;
  --ink:#eef4ff; --ink2:#9fb0c8; --ink3:#5f7089; --red:#ff4d5e; --green:#37d67a;
  --radius:10px;
}
*{box-sizing:border-box; margin:0; padding:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} *{transition:none!important; animation:none!important} }
body{background:var(--canvas); color:var(--ink); font:15px/1.5 Inter,system-ui,sans-serif;
  font-feature-settings:"tnum" 1, "ss01" 1; -webkit-font-smoothing:antialiased}
a{color:var(--blue); text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--blue); outline-offset:2px; border-radius:4px}
.wrap{max-width:1260px; margin:0 auto; padding:0 28px}
@media (max-width:700px){ .wrap{padding:0 14px} }

/* ---- chrome ---- */
.topbar{position:sticky; top:0; z-index:50; background:rgba(10,13,19,.92); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--rule)}
.topbar-in{display:flex; align-items:center; gap:22px; height:58px}
.wordmark{font-family:'Barlow Condensed'; font-weight:800; font-size:25px; letter-spacing:.04em;
  color:var(--ink); white-space:nowrap}
.wordmark b{color:var(--blue); font-weight:800}
.wordmark:hover{text-decoration:none}
nav.mainnav{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none}
nav.mainnav::-webkit-scrollbar{display:none}
nav.mainnav a{padding:7px 11px; border-radius:8px; color:var(--ink2); font-size:13.5px; font-weight:600; white-space:nowrap}
nav.mainnav a:hover{color:var(--ink); background:var(--card2); text-decoration:none}
nav.mainnav a.on{color:var(--canvas); background:var(--blue)}
nav.mainnav a.explore-cta{color:var(--lime); border:1px solid #37430a}
nav.mainnav a.explore-cta.on{color:#0a0d13; background:var(--lime); border-color:var(--lime)}
.ver{margin-left:auto; font:11px/1 'IBM Plex Mono'; color:var(--ink3); white-space:nowrap}
footer{border-top:1px solid var(--rule); margin-top:70px; padding:26px 0 60px; color:var(--ink3); font-size:12.5px}
footer .wrap{display:flex; flex-wrap:wrap; gap:8px 30px}

/* ---- typography ---- */
h1.display{font-family:'Barlow Condensed'; font-weight:800; font-size:clamp(38px,6vw,64px);
  line-height:.95; letter-spacing:.01em; text-transform:uppercase}
h2.sect{font-family:'Barlow Condensed'; font-weight:700; font-size:clamp(21px,2.6vw,27px);
  letter-spacing:.05em; text-transform:uppercase; color:var(--ink); margin:34px 0 12px;
  display:flex; align-items:center; gap:10px}
h2.sect::after{content:""; flex:1; height:1px; background:var(--rule)}
h2.sect .sub{font-family:Inter; font-size:12px; font-weight:500; color:var(--ink3); text-transform:none; letter-spacing:0}
.kicker{font:600 11.5px/1 'IBM Plex Mono'; letter-spacing:.14em; text-transform:uppercase; color:var(--blue)}
.muted{color:var(--ink2)} .dim{color:var(--ink3)}
.small{font-size:12.5px}

/* ---- cards / layout ---- */
.card{background:var(--card); border:1px solid var(--rule); border-radius:var(--radius); padding:16px 18px}
.grid{display:grid; gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.statline{display:flex; flex-wrap:wrap; gap:8px 26px; margin:10px 0}
.stat .v{font-family:'Barlow Condensed'; font-weight:700; font-size:30px; line-height:1}
.stat .l{font-size:11px; color:var(--ink3); text-transform:uppercase; letter-spacing:.08em}

/* ---- tables ---- */
.tblwrap{overflow-x:auto; border:1px solid var(--rule); border-radius:var(--radius); background:var(--card)}
table.tbl{border-collapse:collapse; width:100%; font-size:13.5px}
.tbl th{font:600 11px/1.3 Inter; letter-spacing:.07em; text-transform:uppercase; color:var(--ink3);
  text-align:right; padding:9px 10px; border-bottom:1px solid var(--rule); white-space:nowrap; position:sticky; top:0; background:var(--card); z-index:2}
.tbl th.l, .tbl td.l{text-align:left}
.tbl th.sortable{cursor:pointer; user-select:none}
.tbl th.sortable:hover{color:var(--ink)}
.tbl th.sorted{color:var(--blue)}
.tbl td{padding:7.5px 10px; border-bottom:1px solid #141a28; text-align:right; white-space:nowrap;
  font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:var(--card2)}
.tbl tr.click{cursor:pointer}
.tbl .pos{color:var(--ink3); font-size:11px; font-weight:600}
.tbl .neg{color:var(--red)} .tbl .posv{color:var(--green)}
.num{font-variant-numeric:tabular-nums}

/* ---- entity chips ---- */
.fr{display:inline-flex; align-items:center; gap:9px; min-width:0}
.fr .nm{font-weight:600; color:var(--ink)}
.fr a{color:var(--ink)}
.logo{width:26px; height:26px; border-radius:6px; object-fit:cover; background:var(--card2);
  border:1px solid var(--rule); flex:none}
.logo.lg{width:64px; height:64px; border-radius:12px}
.logo.xl{width:92px; height:92px; border-radius:16px}
.ini{display:inline-flex; align-items:center; justify-content:center; font:700 11px/1 'Barlow Condensed';
  color:var(--canvas); border-radius:6px; flex:none}
.headshot{width:44px; height:32px; object-fit:cover; object-position:top; border-radius:6px; background:var(--card2); flex:none}
.badge{display:inline-block; padding:2px 8px; border-radius:99px; font:600 10.5px/1.5 Inter;
  letter-spacing:.05em; text-transform:uppercase; border:1px solid var(--rule); color:var(--ink2)}
.badge.blue{color:var(--blue); border-color:#0a4a6e}
.badge.lime{color:var(--lime); border-color:#37430a}
.badge.orange{color:var(--orange); border-color:#5c2a08}
.badge.yellow{color:var(--yellow); border-color:#5c470a}
.badge.red{color:var(--red); border-color:#5c111a}
.badge.green{color:var(--green); border-color:#0e4a2b}
.glyph{font-size:15px}
.title-chip{display:inline-flex; align-items:center; gap:5px; color:var(--yellow); font-weight:700}

/* ---- home hero ---- */
.hero{padding:52px 0 8px}
.hero .tag{color:var(--ink2); max-width:620px; margin-top:12px; font-size:15.5px}
.champbar{display:flex; flex-wrap:wrap; gap:16px; align-items:center; margin:26px 0 6px;
  background:linear-gradient(120deg,#101624,#0e1119 60%); border:1px solid var(--rule);
  border-radius:14px; padding:18px 22px}
.champbar .cup{font-size:34px}
.timeline{display:flex; gap:6px; overflow-x:auto; padding:8px 0 14px}
.timeline .yr{flex:none; text-align:center; padding:9px 10px; background:var(--card);
  border:1px solid var(--rule); border-radius:10px; min-width:86px}
.timeline .yr .y{font:700 12px 'IBM Plex Mono'; color:var(--ink3)}
.timeline .yr img{margin:6px auto 4px; display:block}
.timeline .yr .n{font-size:10.5px; color:var(--ink2); max-width:110px; white-space:normal; line-height:1.25}

/* ---- explore ---- */
.xbar{background:var(--card); border:1px solid var(--rule); border-radius:var(--radius);
  padding:14px 16px; margin:14px 0; display:flex; flex-direction:column; gap:11px}
.xrow{display:flex; flex-wrap:wrap; gap:8px 10px; align-items:center}
.xrow .lbl{font:600 10.5px/1 Inter; letter-spacing:.1em; text-transform:uppercase; color:var(--ink3); width:74px; flex:none}
select,input[type=text],input[type=number]{background:var(--card2); color:var(--ink); border:1px solid var(--rule);
  border-radius:8px; padding:6px 9px; font:500 13px Inter}
select:hover,input:hover{border-color:#2a3750}
.chip{display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:99px;
  border:1px solid var(--rule); background:var(--card2); color:var(--ink2); font:600 12px Inter; cursor:pointer; user-select:none}
.chip:hover{color:var(--ink); border-color:#2a3750}
.chip.on{background:var(--blue); border-color:var(--blue); color:#04121d}
.chip.on.lime{background:var(--lime); border-color:var(--lime); color:#131a02}
.chip.warn{color:var(--yellow); border-color:#5c470a; cursor:default}
.btn{display:inline-flex; align-items:center; gap:7px; background:var(--blue); color:#04121d;
  font:700 13px Inter; padding:8px 16px; border-radius:9px; border:none; cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:var(--card2); color:var(--ink2); border:1px solid var(--rule)}
.btn.ghost:hover{color:var(--ink); filter:none}
.btn.lime{background:var(--lime); color:#131a02}
.sentence{font-size:14px; color:var(--ink2); background:var(--card2); border-left:3px solid var(--blue);
  border-radius:6px; padding:10px 14px}
.sentence b{color:var(--ink)}
.resmeta{display:flex; flex-wrap:wrap; gap:7px 18px; font:12px 'IBM Plex Mono'; color:var(--ink3); margin:10px 2px}
.presets{display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 2px}
.drill{background:var(--card2); border-top:2px solid var(--blue)}
.drill td{font-size:12.5px}
#scatterbox{position:relative; margin-top:14px}
#scattertip{position:absolute; pointer-events:none; background:#040810f2; border:1px solid var(--rule);
  border-radius:9px; padding:9px 12px; font-size:12.5px; display:none; z-index:5; max-width:290px}
canvas{max-width:100%}

/* ---- player custody strip ---- */
.cust{display:grid; grid-template-columns:44px repeat(18,1fr); gap:2px; align-items:center; font:600 10px 'IBM Plex Mono'; color:var(--ink3)}
.cust .cell{height:17px; border-radius:3px; background:#10151f; position:relative}
.cust .cell.on{outline:1px solid #ffffff22}
.cust .cell.st::after{content:""; position:absolute; inset:4.5px; border-radius:99px; background:#ffffffd8}
.legend{display:flex; flex-wrap:wrap; gap:7px 14px; margin:8px 0; font-size:12px; color:var(--ink2)}
.legend .sw{display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:5px; vertical-align:-1px}

/* ---- bracket ---- */
.bracket{display:flex; gap:16px; overflow-x:auto; padding-bottom:6px}
.round{min-width:250px; display:flex; flex-direction:column; gap:10px}
.round h4{font:700 11px Inter; letter-spacing:.09em; text-transform:uppercase; color:var(--ink3)}
.game{background:var(--card); border:1px solid var(--rule); border-radius:9px; padding:8px 11px; font-size:13px}
.game .row{display:flex; justify-content:space-between; gap:10px; padding:2.5px 0}
.game .w{color:var(--ink); font-weight:700}
.game .l2{color:var(--ink3)}

/* misc */
.notice{border:1px solid #5c470a; background:#191507; color:#e8d9a0; padding:10px 14px; border-radius:9px; font-size:13px}
.searchbox{width:min(420px,100%)}
.pill-scroll{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px}
.mrow{display:flex; gap:10px; align-items:baseline; padding:5px 0; border-bottom:1px dashed #141a28; font-size:13.5px}
.mrow:last-child{border-bottom:none}
.mrow .k{font:600 12px 'IBM Plex Mono'; color:var(--lime); min-width:120px}
.footlink{color:var(--ink3)}
details.mobile-filters summary{cursor:pointer; font-weight:700; color:var(--ink2); padding:6px 0}
@media (min-width:901px){ details.mobile-filters{display:contents} details.mobile-filters summary{display:none} }
@media (max-width:900px){
  details.mobile-filters{display:block}
  .xrow .lbl{width:100%}
}

/* ---- Luck & Skill ---- */
.band{position:relative;display:block;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.band-in{position:absolute;top:0;height:100%;background:linear-gradient(90deg,rgba(0,162,255,.35),rgba(0,162,255,.7));border-radius:4px}
.band-mk{position:absolute;top:-3px;width:2px;height:14px;background:var(--amber,#ffc400);box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.mtx{overflow:auto;max-width:100%}
.mtx table{border-collapse:separate;border-spacing:0}
.mtx td,.mtx th{text-align:center;padding:5px 7px;font-size:12px}
.mtx td.stick,.mtx th.stick{position:sticky;left:0;z-index:2;background:var(--bg2,#0f1216);text-align:left;min-width:190px}
th.rot{font-size:10px;letter-spacing:.04em;color:var(--ink3);white-space:nowrap;font-weight:600}
.tbl.mono td{font-variant-numeric:tabular-nums}
h3.sect.small{font-size:15px}
/* ---- leaderboards / compare / heatmap (upgrade v3) ---- */
.barw{display:block;height:9px;border-radius:5px;background:var(--line);overflow:hidden;min-width:80px}
.bar{display:block;height:100%;background:linear-gradient(90deg,rgba(0,162,255,.45),rgba(0,162,255,.85));border-radius:5px}
.bar.barneg{background:linear-gradient(90deg,rgba(255,77,94,.45),rgba(255,77,94,.85))}
.heat td.heatc{min-width:30px;color:#eaf2ff;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.heat td,.heat th{padding:5px 6px}
.grid.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:1000px){.grid.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.grid.g4{grid-template-columns:1fr}}

/* ---- player profile (players overhaul) ---- */
.phero{display:flex; gap:24px; align-items:center; flex-wrap:wrap; margin-top:34px;
  border:1px solid var(--rule); border-radius:16px; padding:24px 26px}
.hshot{width:148px; height:108px; object-fit:cover; object-position:top; border-radius:14px;
  border:1px solid var(--rule); background:var(--card2); flex:none}
@media (max-width:600px){ .hshot{width:104px; height:78px} }
.rgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(118px,1fr)); gap:12px 14px; margin-top:10px}
.rcell .rv{font-family:'Barlow Condensed'; font-weight:700; font-size:23px; line-height:1.05}
.rcell .rl{font-size:10.5px; color:var(--ink3); text-transform:uppercase; letter-spacing:.06em; margin-top:2px}
.rk{display:inline-block; margin-top:3px; font:600 10.5px 'IBM Plex Mono'; color:var(--yellow)}
.rk .dim{color:var(--ink3)}
.pct-row{display:grid; grid-template-columns:minmax(118px,168px) 1fr 64px 30px; gap:10px; align-items:center; padding:4.5px 0}
.pct-row .pl{font-size:12px; color:var(--ink2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.pct-row .pbw{height:9px; background:#141a28; border-radius:99px; overflow:hidden}
.pct-row .pbf{display:block; height:100%; border-radius:99px}
.pct-row .pv{font:600 12.5px 'IBM Plex Mono'; text-align:right; white-space:nowrap}
.pct-row .pp{font:700 12.5px 'IBM Plex Mono'; text-align:right}
.tbl tr.dnp td{color:var(--ink3); background:rgba(255,255,255,.012)}
</style>

<script>
(function(){
  var files = ['data/savant.json','data/explore_a.json','data/explore_b.json','data/explore_c.json','data/luck.json','data/logos.json'];
  var done = 0, pct = document.getElementById('bootpct');
  function got(r){ if(!r.ok) throw new Error(r.url+' -> '+r.status); done++; if(pct) pct.textContent = done+'/'+files.length; return r.json(); }
  Promise.all(files.map(function(f){ return fetch(f).then(got); })).then(function(d){
    window.SAVANT = d[0];
    var ex = d[1]; ex.rows = ex.rows.concat(d[2].rows, d[3].rows);
    window.EXPLORE = ex;
    window.LUCK = d[4];
    window.LOGOS = d[5];
    window.GAMELOGS_URLS = ['data/gamelogs.json'];  // lazy: fetched on first player page
    document.getElementById('bootmsg').remove();
    __boot();
  }).catch(function(e){
    document.getElementById('bootmsg').textContent = 'failed to load data: '+e.message;
  });
})();
function __boot(){
/* AFFL Savant — single-page application. Data: window.SAVANT, window.EXPLORE, window.VALID */
(function(){
"use strict";
const S = window.SAVANT, E = window.EXPLORE, V = window.VALID || {}, L = window.LUCK || {};
const $ = sel => document.querySelector(sel);
const app = $('#app');

/* ---------------- helpers ---------------- */
const esc = s => s==null ? '' : String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f0 = v => v==null||isNaN(v) ? '·' : Math.round(v).toLocaleString('en-US');
const f1 = v => v==null||isNaN(v) ? '·' : (Math.round(v*10)/10).toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1});
const f2 = v => v==null||isNaN(v) ? '·' : v.toFixed(2);
const pct1 = v => v==null||isNaN(v) ? '·' : (100*v).toFixed(1)+'%';
const signed = (v,f) => v==null||isNaN(v) ? '·' : (v>0?'+':'')+f(v);
const cls = v => v==null||isNaN(v)||v===0 ? '' : (v>0?'posv':'neg');

const F = {}; S.franchises.forEach(f => F[f.franchise_id] = f);
const FIDX = {}; S.franchises.forEach((f,i) => FIDX[f.franchise_id] = i);
const PL = {}; S.players.forEach(p => PL[p.eid] = p);
const YEARS = Object.keys(S.seasons).map(Number).sort((a,b)=>a-b);
const DONE = YEARS.filter(y => S.seasons[y].complete);
const LAST = DONE[DONE.length-1];
const PALETTE = ['#00a2ff','#ff6a00','#c8ff00','#ffc400','#37d67a','#ff4d5e','#b078ff','#00e0d0',
 '#ff9dc7','#7dd3fc','#f97316','#a3e635','#facc15','#34d399','#f87171','#c084fc','#2dd4bf','#fda4af','#93c5fd'];
const fColor = fid => PALETTE[(FIDX[fid]||0) % PALETTE.length];
const teamOf = (s,tid) => (S.seasons[s]||{teams:[]}).teams.find(t=>t.tid===tid);
const teamOfF = (s,fid) => (S.seasons[s]||{teams:[]}).teams.find(t=>t.fid===fid);
const histName = (s,fid) => { const t = teamOfF(s,fid); return t ? t.name : (F[fid]||{}).display_name; };
const initials = n => (n||'?').split(/\s+/).filter(Boolean).map(w=>w[0]).join('').slice(0,3).toUpperCase();

const LOGOS = window.LOGOS || {};
/* Each logo's data URI is emitted exactly ONCE as a CSS class; markup refers by class. */
const logoCls = {};
(function(){
  const rules = [];
  let i = 0;
  for(const [url, uri] of Object.entries(LOGOS)){
    logoCls[url] = 'lg-'+i;
    rules.push(`.lg-${i}{background-image:url("${uri}")}`);

function sortableTable(el){

      th.closest('table').querySelectorAll('th').forEach(h=>h.classList.remove('sorted'));
      th.classList.add('sorted');

        const a=r1.cells[idx].dataset.v ?? r1.cells[idx].textContent, b=r2.cells[idx].dataset.v ?? r2.cells[idx].textContent;
        const na=parseFloat(a), nb=parseFloat(b);

      }).forEach(r=>tb.appendChild(r));

    th.addEventListener('click',act);
    th.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act();}});
  });
}

let _charts = [];

function withEC(fn){
  if(window.echarts) return fn(window.echarts);
  if(!_ecPromise){
    _ecPromise = new Promise(res=>{
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js';
      s.onload = ()=>res(window.echarts);
      s.onerror = ()=>res(null);
      document.head.appendChild(s);
    });
  }
  _ecPromise.then(ec=>{
    if(ec) fn(ec);
    else document.querySelectorAll('.chartbox').forEach(b=>{
      if(!b.dataset.failed){ b.dataset.failed=1; b.innerHTML='<p class="dim small" style="padding:22px">Charts need the ECharts CDN and it is unreachable right now — every number in them also lives in the tables on this page.</p>'; }
    });
  });
}
function mkChart(id, option, onInit){
  withEC(ec=>{
    const el = document.getElementById(id);
    if(!el) return;                                   // user navigated away
    const old = ec.getInstanceByDom(el);
    if(old) old.dispose();
    const c = ec.init(el, null, {renderer:'canvas'});
    c.setOption(option);
    _charts.push(c);
    if(onInit) onInit(c);
  });
}

/* -- rivalries: pair aggregation + active streaks from matchups -- */
function pairStats(){
  const seen = new Set(), pairs = [];
  Object.keys(S.h2h).forEach(k=>{
    const [a,b] = k.split('|');
    const key = a<b? a+'|'+b : b+'|'+a;
    if(seen.has(key)) return; seen.add(key);
    const r = S.h2h[a+'|'+b]; if(!r) return;
    const g = r.w+r.l+r.t; if(!g) return;
    pairs.push({a, b, g, aw:r.w, bw:r.l, t:r.t, apf:r.pf, bpf:r.pa});
  });
  // chronological per-pair winner runs for active streaks
  const runs = {};
  S.matchups.filter(m=>!m.po&&!m.bye&&m.hs!=null&&m.winner&&m.winner!=='UNDECIDED')
    .sort((x,y)=>x.season-y.season||x.mp-y.mp).forEach(m=>{
      const hf=fid_of(m.season,m.h), af=fid_of(m.season,m.a);
      if(!hf||!af) return;
      const key = hf<af? hf+'|'+af : af+'|'+hf;
      const winner = m.winner==='TIE'? null : (m.winner==='HOME'? hf : af);
      const cur = runs[key];
      if(winner==null){ runs[key]=null; return; }
      if(cur && cur.fid===winner) cur.n++;
      else runs[key] = {fid:winner, n:1};
    });
  pairs.forEach(p=>{ p.live = runs[p.a<p.b?p.a+'|'+p.b:p.b+'|'+p.a] || null; });
  return pairs;
}
function fid_of(s, tid){ const t = teamOf(s, tid); return t? t.fid : null; }

/* -- franchise weekly score heartbeat -- */
function drawFrHeartbeat(fid){
  const xs=[], mine=[], med=[];
  (L.rankHeat||[]).forEach(rh=>{
    const t = rh.teams.find(x=>x.fid===fid);
    rh.weeks.forEach((w,i)=>{
      const all = rh.teams.map(tt=>(tt.scores||[])[i]).filter(v=>v!=null).sort((a,b)=>a-b);
      if(!all.length) return;
      xs.push(rh.s+' W'+w);
      med.push(all[Math.floor(all.length/2)]);
      mine.push(t? (t.scores||[])[i] : null);
    });
  });
  if(!mine.some(v=>v!=null)) return;
  const seasonMarks = [];
  xs.forEach((x,i)=>{ if(x.endsWith(' W1')) seasonMarks.push({xAxis:i}); });
  mkChart('frheart', {
    tooltip: ECTT({}),
    grid: {left:50, right:16, top:30, bottom:26},
    xAxis: ECX({data:xs, axisLabel:{color:'#8fa2bd', fontSize:9.5, interval:(i,v)=>v.endsWith(' W1')&&(+v.slice(0,4))%2===0, formatter:v=>v.slice(0,4)}}),

/* -- franchise skill radar (percentiles among franchises, min 2 seasons) -- */
function franchiseRadarData(){
  const pool = S.franchises.filter(f=>f.seasonsPlayed>=2);
  const lf = {}; (L.franchise||[]).forEach(r=>lf[r.fid]=r);
  const le = {}; (L.lineupFranchise||[]).forEach(r=>le[r.fid]=r);
  const draft = {}, trade = {};
  S.drafts.forEach(d=>{ if(d.bid>0&&d.par!=null){ const o=draft[d.fid]=draft[d.fid]||{par:0,bid:0}; o.par+=d.par; o.bid+=d.bid; } });
  S.trades.forEach(t=>Object.entries(t.alpha||{}).forEach(([fid,a])=>{ trade[fid]=(trade[fid]||0)+a; }));
  const raw = {};
  pool.forEach(f=>{
    const g=f.w+f.l+f.t, k=f.franchise_id;
    raw[k] = {
      ppg: g? f.pf/g : null,
      ap: (lf[k]||{}).apPct,
      eff: (le[k]||{}).eff,
      draft: draft[k]? draft[k].par/draft[k].bid : null,
      trade: trade[k]!=null? trade[k] : null,
      po: f.seasonsPlayed? (f.pw+f.pl>0? f.pw/(f.pw+f.pl||1) : 0) : null,
    };
  });
  const pct = key=>{
    const vals = pool.map(f=>raw[f.franchise_id][key]).filter(v=>v!=null).sort((a,b)=>a-b);
    return v=> v==null||!vals.length? null : Math.round(100*vals.filter(x=>x<=v).length/vals.length);
  };
  return {raw, P:{ppg:pct('ppg'), ap:pct('ap'), eff:pct('eff'), draft:pct('draft'), trade:pct('trade'), po:pct('po')}};
}
const RADAR_AXES = [['ppg','Scoring (PPG)'],['ap','All-play W%'],['eff','Lineup eff'],['draft','Draft PAR/$'],['trade','Trade α'],['po','Playoff W%']];
function drawFrRadar(fid){
  const {raw, P} = franchiseRadarData();
  const me = raw[fid]; if(!me) return;
  const vals = RADAR_AXES.map(([k])=>{ const p=P[k](me[k]); return p==null?0:p; });
  mkChart('frradar', {
    tooltip: ECTT({trigger:'item', formatter:()=>RADAR_AXES.map(([k,l],i)=>`${l}: <b>${vals[i]}</b>th pct`).join('<br>')}),
    radar: {indicator: RADAR_AXES.map(([k,l])=>({name:l, max:100})), radius:'62%',
      axisName:{color:'#9fb0c8', fontSize:10.5}, splitArea:{areaStyle:{color:['rgba(255,255,255,.015)','rgba(255,255,255,.03)']}},
      axisLine:{lineStyle:{color:'#26314a'}}, splitLine:{lineStyle:{color:'#26314a'}}},
    series: [{type:'radar', data:[{value:vals, name:'percentile'}],

  });
}

/* -- compare radar (percentile within own position, careers min 16 g) -- */
function drawCmpRadar(sel, rowsBy){
  const axes = [['fpg','FP/g'],['xfpg','xFP/g'],['fpoeg','FPOE/g'],['afpoe','adj FPOE'],['tdg','TD/g'],['volg','Touches/g']];
  const careerOf = rs=>{
    const c={g:0,fp:0,xfp2:0,fpoe2:0,afpoe2:0,td:0,vol:0};
    rs.forEach(r=>{ c.g+=r[SCOL.g]||0; c.fp+=r[SCOL.fp]||0; c.xfp2+=r[SCOL.xfp2]||0; c.fpoe2+=r[SCOL.fpoe2]||0; c.afpoe2+=r[SCOL.afpoe2]||0;
      c.td+=(r[SCOL.ptd]||0)+(r[SCOL.rtd]||0)+(r[SCOL.rectd]||0);
      c.vol+=(r[SCOL.car]||0)+(r[SCOL.tgt]||0)+(r[SCOL.db]||0); });
    return c.g<16? null : {fpg:c.fp/c.g, xfpg:c.xfp2/c.g, fpoeg:c.fpoe2/c.g, afpoe:c.afpoe2, tdg:c.td/c.g, volg:c.vol/c.g, g:c.g};
  };
  const byPos = {};
  const byPlayer = {};
  E.seasonRows.forEach(r=>{ (byPlayer[r[SCOL.p]]=byPlayer[r[SCOL.p]]||[]).push(r); });
  Object.entries(byPlayer).forEach(([pi, rs])=>{
    const pos = EPOS[pi]; if(!pos) return;
    const c = careerOf(rs); if(!c) return;
    (byPos[pos]=byPos[pos]||[]).push(c);
  });
  const pctIn = (pos, key, v)=>{
    const vals = (byPos[pos]||[]).map(c=>c[key]).filter(x=>x!=null).sort((a,b)=>a-b);
    return !vals.length||v==null? 0 : Math.round(100*vals.filter(x=>x<=v).length/vals.length);
  };
  const data = sel.map(pi=>{
    const c = careerOf(rowsBy.get(pi)||[]); const pos = EPOS[pi];
    if(!c) return null;
    return {name: ENAME[pi], value: axes.map(([k])=>pctIn(pos,k,c[k]))};
  }).filter(Boolean);
  if(data.length<2) return;
  const colors = ['#00a2ff','#ff6a00','#c8ff00','#b078ff'];
  mkChart('cmpradar', {
    tooltip: ECTT({trigger:'item', formatter:p=>`<b>${esc(p.name)}</b><br>`+axes.map(([k,l],i)=>`${l}: <b>${p.value[i]}</b>th`).join('<br>')}),
    legend: {top:0, textStyle:{color:'#9fb0c8', fontSize:11}},
    color: colors,
    radar: {indicator: axes.map(([k,l])=>({name:l, max:100})), radius:'58%',
      axisName:{color:'#9fb0c8', fontSize:10.5}, splitArea:{areaStyle:{color:['rgba(255,255,255,.015)','rgba(255,255,255,.03)']}},
      axisLine:{lineStyle:{color:'#26314a'}}, splitLine:{lineStyle:{color:'#26314a'}}},
    series: [{type:'radar', data: data.map((d,i)=>({name:d.name, value:d.value,
      areaStyle:{color:colors[i%4]+'22'}, lineStyle:{width:2}, symbolSize:4}))}],
  });
}

/* ---------------- FRANCHISES ---------------- */
function franchisesView(){
  const cards = S.franchises.map(f=>{
    const g=f.w+f.l+f.t, wp=g?(f.w+0.5*f.t)/g:0;
    return `<div class="card" style="display:flex;gap:14px;align-items:center;cursor:pointer" onclick="location.hash='#/f/${f.franchise_id}'">
      ${logoHtml(f.franchise_id,'lg')}
      <div style="min-width:0">
        <div style="font-family:'Barlow Condensed';font-weight:700;font-size:21px">${esc(f.display_name)} ${f.glyph?`<span class="glyph">${esc(f.glyph)}</span>`:''}</div>
        <div class="dim small">${esc(f.owners.join(', '))} · ${f.first_season}–${f.last_season}${f.is_active_2026?'':' · alumni'}</div>
        <div class="small muted num">${f.w}–${f.l}${f.t?'–'+f.t:''} (${pct1(wp)}) · ${f.titles.length? '🏆 '.repeat(f.titles.length):'no titles'}</div>
      </div></div>`;
  }).join('');
  /* rivalries: pair-level aggregates + active runs */
  const ps = pairStats();
  const named = p=>({...p, an:(F[p.a]||{}).display_name||p.a, bn:(F[p.b]||{}).display_name||p.b});
  const q = ps.filter(p=>p.g>=8).map(named);
  const lop = [...q].sort((x,y)=>Math.abs((y.aw+0.5*y.t)/y.g-.5)-Math.abs((x.aw+0.5*x.t)/x.g-.5))[0];
  const even = [...q].sort((x,y)=>(Math.abs((x.aw+0.5*x.t)/x.g-.5)-Math.abs((y.aw+0.5*y.t)/y.g-.5))||(y.g-x.g))[0];
  const most = [...ps.map(named)].sort((x,y)=>y.g-x.g)[0];
  const marg = [...q].sort((x,y)=>Math.abs(y.apf-y.bpf)/y.g-Math.abs(x.apf-x.bpf)/x.g)[0];
  const shoot = [...q].sort((x,y)=>(y.apf+y.bpf)/y.g-(x.apf+x.bpf)/x.g)[0];
  const live = [...ps.map(named)].filter(p=>p.live&&p.live.n>=3).sort((x,y)=>y.live.n-x.live.n)[0];
  const rc = (icon,title,body,sub)=>`<div class="card"><div class="kicker">${icon} ${title}</div>
    <div style="font-family:'Barlow Condensed';font-weight:700;font-size:19px;margin:6px 0 2px">${body}</div>
    <div class="dim small">${sub}</div></div>`;
  const lopW = lop && ((lop.aw+0.5*lop.t)/lop.g>=.5? {w:lop.an, l:lop.bn, r:`${lop.aw}–${lop.bw}${lop.t?'–'+lop.t:''}`, p:(lop.aw+0.5*lop.t)/lop.g} : {w:lop.bn, l:lop.an, r:`${lop.bw}–${lop.aw}${lop.t?'–'+lop.t:''}`, p:(lop.bw+0.5*lop.t)/lop.g});
  const rivalCards = [
    lop? rc('👑','Most lopsided rivalry', `${esc(lopW.w)} owns ${esc(lopW.l)}`, `${lopW.r} · ${pct1(lopW.p)} win rate · min 8 meetings`):'',
    even? rc('⚖','Dead-even series', `${esc(even.an)} vs ${esc(even.bn)}`, `${even.aw}–${even.bw}${even.t?'–'+even.t:''} across ${even.g} meetings`):'',
    most? rc('🔁','Most meetings', `${esc(most.an)} vs ${esc(most.bn)}`, `${most.g} regular-season games since 2014`):'',
    marg? (function(){
      const aWins = marg.apf>marg.bpf;
      const wn = aWins?marg.an:marg.bn, ln = aWins?marg.bn:marg.an;
      const wavg = Math.max(marg.apf,marg.bpf)/marg.g, lavg = Math.min(marg.apf,marg.bpf)/marg.g;
      const wrec = aWins? `${marg.aw}–${marg.bw}` : `${marg.bw}–${marg.aw}`;
      return rc('💪','Widest average margin', `${esc(wn)} over ${esc(ln)}`,
        `by ${f1(wavg-lavg)}/game · ${f1(wavg)}–${f1(lavg)} avg score · ${wrec}${marg.t?'–'+marg.t:''} in ${marg.g} meetings`);
    })():'',
    shoot? rc('🎆','Highest-scoring series', `${esc(shoot.an)} vs ${esc(shoot.bn)}`, `${f1((shoot.apf+shoot.bpf)/shoot.g)} combined points per meeting`):'',
    live? rc('🔥','Longest active run', `${esc((F[live.live.fid]||{}).display_name)} · ${live.live.n} straight`, `over ${esc(live.live.fid===live.a?live.bn:live.an)}, and counting`):'',
  ].join('');
  /* H2H grid, ordered by all-time win% */
  const ordered = S.franchises.filter(f=>f.seasonsPlayed>0)
    .sort((a,b)=>((b.w+0.5*b.t)/Math.max(1,b.w+b.l+b.t))-((a.w+0.5*a.t)/Math.max(1,a.w+a.l+a.t)));
  const gHdr = ordered.map(f=>`<th class="rot" title="${esc(f.display_name)}">${esc(f.code||'')}</th>`).join('');
  const gRows = ordered.map(me=>{
    const cells = ordered.map(op=>{
      if(op.franchise_id===me.franchise_id) return '<td class="dim">—</td>';
      const r = S.h2h[me.franchise_id+'|'+op.franchise_id];
      if(!r||(r.w+r.l+r.t)===0) return '<td class="dim">·</td>';
      const g = r.w+r.l+r.t, wp = (r.w+0.5*r.t)/g;
      const a = Math.min(0.14+g/28, 0.55)*Math.min(Math.abs(wp-.5)*4,1);
      const bg = wp>0.5? `rgba(55,214,122,${a})` : wp<0.5? `rgba(255,77,94,${a})` : 'transparent';
      return `<td style="background:${bg}" title="${esc(me.display_name)} vs ${esc(op.display_name)}: ${r.w}–${r.l}${r.t?'–'+r.t:''} · ${f1(r.pf)}–${f1(r.pa)} pts">${r.w}–${r.l}</td>`;
    }).join('');
    return `<tr><td class="l stick">${frLink(me.franchise_id)}</td>${cells}</tr>`;
  }).join('');
  app.innerHTML = `<div class="wrap"><div class="hero"><div class="kicker">Owner-continuity identities · ESPN slots are not franchises</div>
    <h1 class="display">Franchises</h1></div><div class="grid g2">${cards}</div>
    <h2 class="sect">Rivalries <span class="sub">pair records, regular season 2014–${LAST}</span></h2>
    <div class="grid g3">${rivalCards}</div>
    <h2 class="sect">Head-to-head grid <span class="sub">row's record vs column · shading = dominance × meetings</span></h2>
    <div class="tblwrap mtx"><table class="tbl mono"><thead><tr><th class="l stick">Franchise</th>${gHdr}</tr></thead><tbody>${gRows}</tbody></table></div>
    <p class="dim small" style="margin-top:8px">Hover a cell for the full series line. Every pairing that ever met is here — including alumni fossils.</p>
  </div>`;
}

  const rivals = S.franchises.filter(o=>o.franchise_id!==fid).map(o=>{

    return {o, r, diff: r.pf-r.pa, g: r.w+r.l+r.t};
  }).filter(Boolean).sort((a,b)=>b.g-a.g);
  const rivalRows = rivals.map(({o,r,diff})=>`<tr>
    <td class="l">${frLink(o.franchise_id)}</td><td data-v="${r.w}">${r.w}–${r.l}${r.t?'–'+r.t:''}</td>

const AGG_KEYS = ['g','fp','xfp2','fpoe2','afpoe2','pyd','ptd','pint','cmp','att','sk','car','ryd','rtd',
 'gl','rzc','tgt','rec','recyd','rectd','air','yac','rztgt','eztgt','recepa','repa','pepa','db',
 'fuml','fgm','fga','xpm','xpa'];
function aggInit(){ const a={}; AGG_KEYS.forEach(k=>a[k]=0); a.adotW=0; a.cpoeW=0; a.tshareW=0; a.woprW=0; return a; }
function aggAdd(a, r){
  AGG_KEYS.forEach(k=>{ const v=r[SCOL[k]]; if(v!=null) a[k]+=v; });
  const g=r[SCOL.g]||0, tgt=r[SCOL.tgt]||0, db=r[SCOL.db]||0;
  if(r[SCOL.adot]!=null) a.adotW += r[SCOL.adot]*tgt;
  if(r[SCOL.cpoe]!=null) a.cpoeW += r[SCOL.cpoe]*db;
  if(r[SCOL.tshare]!=null) a.tshareW += r[SCOL.tshare]*g;
  if(r[SCOL.wopr]!=null) a.woprW += r[SCOL.wopr]*g;
  return a;
}
function pQual(pos, a, career){
  const m = career?2:1;
  if((a.g||0) < (career?16:6)) return false;
  if(pos==='QB') return a.att >= 100*m;
  if(pos==='RB') return (a.car+a.tgt) >= 50*m;
  if(pos==='WR') return a.tgt >= 30*m;
  if(pos==='TE') return a.tgt >= 20*m;
  if(pos==='K')  return a.fga >= 10*m;
  return true;
}

let _pools = null;
function pctPools(){
  if(_pools) return _pools;
  const seasonAggs = {}, careerAggs = {}, rowsByPi = new Map();
  E.seasonRows.forEach(r=>{
    const pi=r[SCOL.p], pos=EPOS[pi]; if(!pos||!PM[pos]) return;
    if(!rowsByPi.has(pi)) rowsByPi.set(pi, []);
    rowsByPi.get(pi).push(r);
    const sk = pos+'|'+r[SCOL.s];
    (seasonAggs[sk]=seasonAggs[sk]||[]).push(aggAdd(aggInit(), r));
  });
  rowsByPi.forEach((rs, pi)=>{
    const pos=EPOS[pi];
    const a=aggInit(); rs.forEach(r=>aggAdd(a,r));
    (careerAggs[pos]=careerAggs[pos]||[]).push(a);
  });
  _pools = {seasonAggs, careerAggs, rowsByPi, sorted:{}};
  return _pools;
}
function pctOf(pos, scope, mk, fn, v, inv, career){
  if(v==null) return null;
  const P = pctPools();
  const ck = pos+'|'+scope+'|'+mk;
  let vals = P.sorted[ck];
  if(!vals){
    const aggs = (scope==='career'? P.careerAggs[pos] : P.seasonAggs[pos+'|'+scope]) || [];
    vals = aggs.filter(a=>pQual(pos,a,career)).map(fn).filter(x=>x!=null&&!isNaN(x)).sort((a,b)=>a-b);
    P.sorted[ck] = vals;
  }
  if(!vals.length) return null;
  let lo=0, hi=vals.length;
  while(lo<hi){ const m=(lo+hi)>>1; if(vals[m]<=v) lo=m+1; else hi=m; }
  const p = Math.round(100*lo/vals.length);
  if(!inv) return {p, n:vals.length};
  let lo2=0, hi2=vals.length;
  while(lo2<hi2){ const m=(lo2+hi2)>>1; if(vals[m]<v) lo2=m+1; else hi2=m; }
  return {p:Math.round(100*(vals.length-lo2)/vals.length), n:vals.length};
}
const pctColor = p => `hsl(${Math.round(p*1.2)},68%,50%)`;
function pctBarsHtml(pos, agg, scope, career){
  const rows = (PM[pos]||[]).map(([mk,l,fn,fmt,inv])=>{
    const v = fn(agg);
    const pr = pctOf(pos, scope, mk, fn, v, inv, career);
    if(v==null||pr==null) return '';
    return `<div class="pct-row" title="${esc(l)}: ${pr.p}th percentile among ${pr.n} qualified ${esc(pos)} ${career?'careers':scope+' seasons'}">
      <span class="pl">${esc(l)}</span>
      <span class="pbw"><span class="pbf" style="width:${Math.max(2,pr.p)}%;background:${pctColor(pr.p)}"></span></span>
      <span class="pv">${fmt(v)}</span><span class="pp" style="color:${pctColor(pr.p)}">${pr.p}</span></div>`;
  }).filter(Boolean).join('');
  return rows || '<p class="dim small">Not enough volume for a percentile profile in this scope.</p>';
}

/* ---- league-rank memos for the AFFL résumé ---- */
let _lr = null;
function leagueRanks(){
  if(_lr) return _lr;
  const C = COL;
  const bestWk = {}, benchLeft = {}, afflWk = {};
  const regW = {}; Object.keys(S.seasons).forEach(y=>regW[y]=S.seasons[y].regWeeks||14);
  E.rows.forEach(r=>{
    const pi=r[C.p], v=r[C.affl];
    if(v==null) return;
    afflWk[pi]=(afflWk[pi]||0)+1;
    if(r[C.w] > (regW[r[C.s]]||14)) return;   // record-book scope: regular season only
    if(r[C.st]){ const b=bestWk[pi]; if(!b||v>b.v) bestWk[pi]={v, s:r[C.s], w:r[C.w], fid:E.franchises[r[C.f]][0]}; }
    else if(r[C.s]>=2018) benchLeft[pi]=(benchLeft[pi]||0)+v;
  });
  const dr = {};
  S.drafts.forEach(d=>{
    const o = dr[d.eid]=dr[d.eid]||{n:0,usd:0,par:0,peak:null};
    o.n++; if(d.bid>0){ o.usd+=d.bid; if(!o.peak||d.bid>o.peak.bid) o.peak={bid:d.bid,s:d.s,fid:d.fid}; }
    if(d.par!=null) o.par+=d.par;
  });
  const tr = {};
  S.trades.forEach(t=>Object.values(t.sides).forEach(eids=>eids.forEach(e=>{ tr[e]=(tr[e]||0)+1; })));
  const rankMap = (pairs, desc=true)=>{
    const sorted=[...pairs].sort((a,b)=>desc?b[1]-a[1]:a[1]-b[1]);
    const m={}; sorted.forEach(([k],i)=>m[k]=i+1); return {m, n:sorted.length};
  };
  _lr = {
    bestWk, benchLeft, dr, tr,
    afflPts: rankMap(S.players.filter(p=>p.afflPts>0).map(p=>[p.eid,p.afflPts])),
    weeks: rankMap(S.players.filter(p=>p.stints.length).map(p=>[p.eid,p.stints.reduce((a,s)=>a+s.weeks,0)])),
    usd: rankMap(Object.entries(dr).filter(([,o])=>o.usd>0).map(([e,o])=>[e,o.usd])),
    dpar: rankMap(Object.entries(dr).filter(([,o])=>o.n>0).map(([e,o])=>[e,o.par])),
    bwk: rankMap(Object.entries(bestWk).map(([pi,b])=>[pi,b.v])),
  };
  return _lr;
}
const rkChip = (rk, n)=> rk? `<span class="rk">#${rk} <span class="dim">of ${f0(n)}</span></span>` : '';

/* ---- career NFL memo for the index ---- */
let _cnfl = null;
function careerNfl(){
  if(_cnfl) return _cnfl;
  _cnfl = new Map();
  E.seasonRows.forEach(r=>{
    const pi=r[SCOL.p];
    let c=_cnfl.get(pi);
    if(!c){ c={g:0,fp:0,xfp2:0,fpoe2:0,s0:r[SCOL.s],s1:r[SCOL.s],tm:r[SCOL.tm]}; _cnfl.set(pi,c); }
    c.g+=r[SCOL.g]||0; c.fp+=r[SCOL.fp]||0; c.xfp2+=r[SCOL.xfp2]||0; c.fpoe2+=r[SCOL.fpoe2]||0;
    if(r[SCOL.s]>=c.s1){ c.s1=r[SCOL.s]; c.tm=r[SCOL.tm]||c.tm; }
    if(r[SCOL.s]<c.s0) c.s0=r[SCOL.s];
  });
  return _cnfl;
}

function custodyMapHtml(pi){
  const C = COL, bySeason = {};
  E.rows.forEach(r=>{ if(r[C.p]===pi) (bySeason[r[C.s]] = bySeason[r[C.s]]||[]).push(r); });
  const custYears = Object.keys(bySeason).map(Number).sort((a,b)=>a-b);
  if(!custYears.length) return {html:'', legend:'', fids:[]};
  const strip = custYears.map(y=>{
    const cells = [];
    for(let w=1; w<=18; w++){
      const r = bySeason[y].find(x=>x[C.w]===w);
      if(!r){ cells.push('<span class="cell"></span>'); continue; }
      const fid = E.franchises[r[C.f]][0];
      cells.push(`<span class="cell on ${r[C.st]?'st':''}" title="${y} Wk ${w} · ${esc(histName(y,fid))}${r[C.ev]?' · held (slot unobservable)':r[C.st]?' · started':' · bench'}${r[C.affl]!=null?' · '+f1(r[C.affl])+' pts':''}" style="background:${fColor(fid)}"></span>`);
    }
    return `<span>${y}</span>${cells.join('')}`;
  }).join('');
  const fids = [...new Set([].concat(...Object.values(bySeason)).map(r=>E.franchises[r[C.f]][0]))];
  const legend = fids.map(f=>`<span><span class="sw" style="background:${fColor(f)}"></span>${esc((F[f]||{}).display_name)}</span>`).join('');
  return {html:strip, legend, fids};
}

function resumeHtml(p, pi){
  const lr = leagueRanks();
  const wks = p.stints.reduce((a,s)=>a+s.weeks,0), sts = p.stints.reduce((a,s)=>a+s.starts,0);
  const seasonsHeld = new Set(p.stints.map(s=>s.s)).size;
  const frs = new Set(p.stints.map(s=>s.fid)).size;
  const d = lr.dr[p.eid], trN = lr.tr[p.eid]||0;
  const bw = pi!=null? lr.bestWk[pi] : null;
  const bench = pi!=null? lr.benchLeft[pi] : null;
  const cell = (v,l,rk)=>`<div class="rcell"><div class="rv">${v}</div><div class="rl">${l}</div>${rk||''}</div>`;
  const own = [
    cell(f0(wks),'Custody weeks', rkChip(lr.weeks.m[p.eid], lr.weeks.n)),
    cell(f0(sts),'Starts'),
    cell(wks?pct1(sts/wks):'·','Start rate'),
    cell(seasonsHeld,'Seasons held'),
    cell(frs,'Franchises'),
    cell(trN||'·','Trades involved'),
  ].join('');
  const val = [
    cell(d&&d.usd?'$'+d.usd:'·','Lifetime auction $', d&&d.usd?rkChip(lr.usd.m[p.eid], lr.usd.n):''),
    cell(d&&d.peak?'$'+d.peak.bid:'·', d&&d.peak?`Peak price · ${d.peak.s}`:'Peak price'),
    cell(d?d.n:'·','Times drafted'),
    cell(d?signed(d.par,f1):'·','Career draft PAR', d?rkChip(lr.dpar.m[p.eid], lr.dpar.n):''),
  ].join('');
  const perf = [
    cell(f1(p.afflPts),'AFFL pts under custody', rkChip(lr.afflPts.m[p.eid], lr.afflPts.n)),
    cell(wks?f1(p.afflPts/wks):'·','Pts / custody week'),
    cell(bw?f1(bw.v):'·', bw?`Best started reg-season wk · ${bw.s} W${bw.w}`:'Best started week (reg)', bw?rkChip(lr.bwk.m[String(pi)], lr.bwk.n):''),
    cell(bench!=null?f1(bench):'·','Bench pts left (reg, 2018+)'),
  ].join('');
  return `<h2 class="sect">AFFL résumé <span class="sub">ranks are all-time among every player the league has held</span></h2>
  <div class="grid g3">
    <div class="card"><div class="kicker">Ownership</div><div class="rgrid">${own}</div></div>
    <div class="card"><div class="kicker">Draft value</div><div class="rgrid">${val}</div></div>
    <div class="card"><div class="kicker">Production</div><div class="rgrid">${perf}</div></div>
  </div>`;
}

/* weekly game log table for one season */
function logTableHtml(logs, s, pos){
  const rows = logs.filter(r=>r.s===s);
  if(!rows.length) return '<p class="dim">No logged weeks.</p>';
  const isQB=pos==='QB', isK=pos==='K', isRec=pos==='WR'||pos==='TE', isRB=pos==='RB';
  const affl = r=>{
    if(!r.cust) return '<span class="dim small">FA</span>';
    const st = r.cust.ev? '<span class="badge" title="pre-2018: lineup slot unobservable">held</span>'
      : r.cust.st? '<span class="badge green">ST</span>'
      : (r.fp!=null&&r.fp>=15? '<span class="badge red" title="left on the bench for a big game">BN</span>':'<span class="badge">BN</span>');
    return `<span style="display:inline-flex;align-items:center;gap:6px">${logoHtml(r.cust.fid,'',r.s)}${st}</span>`;
  };
  const head = `<tr><th>Wk</th><th class="l">Tm</th><th class="l">Opp</th><th class="l" title="AFFL custody: franchise + started/bench">AFFL</th>
    ${isQB?'<th>Cmp</th><th>Att</th><th>PaYd</th><th>PaTD</th><th>INT</th><th>Sk</th><th>Car</th><th>RuYd</th><th>RuTD</th>':''}
    ${isRB?'<th>Car</th><th>RuYd</th><th>RuTD</th><th>Tgt</th><th>Rec</th><th>ReYd</th><th>ReTD</th>':''}
    ${isRec?'<th>Tgt</th><th>Rec</th><th>ReYd</th><th>ReTD</th><th>Car</th><th>RuYd</th>':''}
    ${isK?'<th>FGM</th><th>FGA</th><th>XPM</th><th>XPA</th>':''}
    ${!isK?'<th title="fumbles lost">FmL</th>':''}
    <th>FP</th><th>xFP</th><th>FPOE</th></tr>`;
  const body = rows.map(r=>{
    if(r.dnp) return `<tr class="dnp"><td>${r.w}</td><td class="l" colspan="2"><span class="dim">no NFL game — bye / inactive</span></td>
      <td class="l">${affl(r)}</td><td class="l dim small" colspan="${(isQB?9:isRB?7:isRec?6:isK?4:0)+(isK?0:1)+3}">${r.cust&&r.cust.affl!=null?'AFFL applied: '+f1(r.cust.affl)+' pts':''}</td></tr>`;
    return `<tr><td><b>${r.w}</b></td><td class="l dim small">${esc(r.tm||'')}</td><td class="l small">${oppCell(r.s, r.opp, pos)}</td>
    <td class="l">${affl(r)}</td>
    ${isQB?`<td>${f0(r.cmp)}</td><td>${f0(r.att)}</td><td>${f0(r.pyd)}</td><td>${f0(r.ptd)}</td><td>${f0(r.int)}</td><td>${f0(r.sk)}</td><td>${f0(r.car)}</td><td>${f0(r.ryd)}</td><td>${f0(r.rtd)}</td>`:''}
    ${isRB?`<td>${f0(r.car)}</td><td>${f0(r.ryd)}</td><td>${f0(r.rtd)}</td><td>${f0(r.tgt)}</td><td>${f0(r.rec)}</td><td>${f0(r.recyd)}</td><td>${f0(r.rectd)}</td>`:''}
    ${isRec?`<td>${f0(r.tgt)}</td><td>${f0(r.rec)}</td><td>${f0(r.recyd)}</td><td>${f0(r.rectd)}</td><td>${f0(r.car)}</td><td>${f0(r.ryd)}</td>`:''}
    ${isK?`<td>${f0(r.fgm)}</td><td>${f0(r.fga)}</td><td>${f0(r.xpm)}</td><td>${f0(r.xpa)}</td>`:''}
    ${!isK?`<td>${r.fuml?`<span class="neg">${r.fuml}</span>`:'0'}</td>`:''}
    <td><b>${f1(r.fp)}</b></td><td class="dim">${f1(r.xfp)}</td><td class="${cls(r.fpoe)}">${signed(r.fpoe,f1)}</td></tr>`;
  }).join('');
  return `<div class="tblwrap"><table class="tbl"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}

function drawSeasonArc(pi, eid){
  const rows = (pctPools().rowsByPi.get(pi)||[]).slice().sort((a,b)=>a[SCOL.s]-b[SCOL.s]);
  if(rows.length<2) return;
  const ys = rows.map(r=>r[SCOL.s]);
  const fpg = rows.map(r=>r[SCOL.g]?+((r[SCOL.fp]||0)/r[SCOL.g]).toFixed(2):null);
  const xfpg = rows.map(r=>r[SCOL.g]&&r[SCOL.xfp2]?+((r[SCOL.xfp2]||0)/r[SCOL.g]).toFixed(2):null);
  const bids = ys.map(y=>{ const d=S.drafts.find(d=>d.eid===eid&&d.s===y&&d.bid>0); return d?d.bid:null; });
  mkChart('plarc', {
    tooltip: ECTT({}),
    legend: {top:0, textStyle:{color:'#9fb0c8', fontSize:11}},
    grid: {left:50, right:52, top:34, bottom:26},
    xAxis: ECX({data:ys}),
    yAxis: [ECY(), ECY({splitLine:{show:false}, axisLabel:{formatter:'${value}', color:'#8fa2bd', fontFamily:'IBM Plex Mono', fontSize:10.5}})],
    series: [
      {name:'Auction $ paid', type:'bar', yAxisIndex:1, data:bids, barWidth:'42%',
       itemStyle:{color:'rgba(255,196,0,.32)', borderColor:'#ffc400', borderWidth:1}},
      {name:'FP / game', type:'line', data:fpg, smooth:.3, symbol:'circle', symbolSize:6,
       lineStyle:{width:2.5, color:'#00a2ff'}, itemStyle:{color:'#00a2ff'}, connectNulls:true},
      {name:'xFP / game', type:'line', data:xfpg, smooth:.3, symbol:'none',
       lineStyle:{width:1.6, type:'dashed', color:'#c8ff00'}, itemStyle:{color:'#c8ff00'}, connectNulls:true},
    ],
  });
}
function drawWeeklyBeat(pi){
  const logs = playerLogs(pi).filter(r=>!r.dnp);
  if(logs.length<5) return;
  const xs = logs.map(r=>r.s+' W'+r.w);
  const marks = []; xs.forEach((x,i)=>{ if(i>0 && logs[i].s!==logs[i-1].s) marks.push({xAxis:i-0.5}); });
  mkChart('plbeat', {
    tooltip: ECTT({formatter: ps=>{
      const i = ps[0].dataIndex, r = logs[i];
      const cu = r.cust? `${esc(histName(r.s, r.cust.fid)||'')} · ${r.cust.ev?'held':r.cust.st?'started':'benched'}` : 'not AFFL-rostered';
      return `<b>${r.s} Week ${r.w}</b> · ${esc(r.tm||'')}${r.opp?' v '+esc(r.opp):''}<br>FP <b>${f1(r.fp)}</b> · xFP ${f1(r.xfp)} · FPOE ${signed(r.fpoe,f1)}<br><span style="color:#8fa2bd">${cu}</span>`; }}),
    grid: {left:46, right:16, top:26, bottom:30},
    xAxis: ECX({data:xs, axisLabel:{interval:(i,v)=>v.endsWith(' W1'), formatter:v=>v.slice(0,4), fontSize:9.5}}),
    yAxis: ECY(),
    series: [
      {name:'FP', type:'bar', barWidth:'62%',
       data: logs.map(r=>({value:r.fp, itemStyle:{color: r.cust? (r.cust.st||r.cust.ev? fColor(r.cust.fid) : '#39445e') : '#20293c',
         borderColor: r.cust&&!r.cust.st&&!r.cust.ev&&(r.fp||0)>=15? '#ff4d5e':'transparent', borderWidth: 1.4}})),
       markLine:{silent:true, symbol:'none', label:{show:false}, lineStyle:{color:'#26314a', width:1}, data:marks}},
      {name:'xFP', type:'line', data:logs.map(r=>r.xfp), symbol:'none', lineStyle:{width:1.4, color:'#c8ff00', opacity:.85}, z:3},
    ],
  });
}

          <div class="stat"><div class="v">${p.stints.reduce((a,s)=>a+s.starts,0)}</div><div class="l">Starts</div></div>
          <div class="stat"><div class="v">${[...new Set(p.stints.map(s=>s.fid))].length}</div><div class="l">Franchises</div></div>
          ${cn?`<div class="stat"><div class="v">${f0(cn.g)}</div><div class="l">NFL games 14–${String(LAST).slice(2)}</div></div>
          <div class="stat"><div class="v">${f1(cn.fp)}</div><div class="l">NFL FP (std)</div></div>
          <div class="stat"><div class="v ${cls(cn.fpoe2)}">${signed(cn.fpoe2,f1)}</div><div class="l">Career FPOE</div></div>`:''}

      <div><h2 class="sect" style="margin-top:0">Custody stints</h2>

        $('#glchips').querySelectorAll('[data-gls]').forEach(c=>c.onclick=()=>{ glSeason=+c.dataset.gls; drawDst(); });
      };
      drawDst();
    }
  }
}

    const c = champOf(y); const ru = sd.teams.find(t=>t.finalRank===2);
    const pf = [...sd.teams].sort((a,b)=>b.pf-a.pf)[0];

function seasonView(y){
  const sd = S.seasons[y]; if(!sd){ app.innerHTML='<div class="wrap"><p style="padding:40px 0">Unknown season.</p></div>'; return; }
  const teams = [...sd.teams].sort((a,b)=>(a.finalRank||99)-(b.finalRank||99) || (b.w-a.w));
  const rows = teams.map(t=>`<tr class="click" data-href="#/f/${t.fid}">
    <td>${sd.complete?(t.finalRank||'·'):'·'}</td>
    <td class="l">${logoHtml(t.fid,'',y)} <a class="nm" href="#/f/${t.fid}">${esc(t.name)}</a> ${t.finalRank===1?'<span class="title-chip">🏆</span>':''}</td>
    <td class="l dim small">${esc((F[t.fid]||{}).owners?.join(', ')||'')}</td>
    <td>${sd.complete?`${t.w}–${t.l}${t.t?'–'+t.t:''}`:'·'}</td>
    <td data-v="${t.pf||0}">${sd.complete?f1(t.pf):'·'}</td><td data-v="${t.pa||0}">${sd.complete?f1(t.pa):'·'}</td>
    <td>${t.seed||'·'}</td></tr>`).join('');
  let bracket = '';
  if(sd.complete){
    const po = S.matchups.filter(m=>m.season===y && m.po && !m.bye && m.winner && m.winner!=='UNDECIDED');
    const wb = po.filter(m=>m.tier==='WINNERS_BRACKET');
    const list = (wb.length?wb:po);
    const mps = [...new Set(list.map(m=>m.mp))].sort((a,b)=>a-b);
    const roundName = (i,n)=> i===n-1?'Championship': i===n-2?'Semifinals':'Round '+(i+1);
    bracket = `<div class="bracket">${mps.map((mp,i)=>{
      const games = list.filter(m=>m.mp===mp);
      return `<div class="round"><h4>${roundName(i,mps.length)}${wb.length?'':' · playoff week'}</h4>${games.map(m=>{
        const ht=teamOf(y,m.h), at=teamOf(y,m.a);
        const hw = m.winner==='HOME';
        return `<div class="game">
          <div class="row"><span class="${hw?'w':'l2'}">${logoHtml(ht.fid,'',y)} ${esc(ht.name)}</span><span class="num ${hw?'w':'l2'}">${f1(m.hs)}</span></div>
          <div class="row"><span class="${!hw?'w':'l2'}">${logoHtml(at.fid,'',y)} ${esc(at.name)}</span><span class="num ${!hw?'w':'l2'}">${f1(m.as_)}</span></div></div>`;
      }).join('')}</div>`;}).join('')}</div>
      ${wb.length?'' : `<p class="dim small">ESPN did not record bracket tiers before 2018 — these are all playoff-week games; the title is per final standings.</p>`}`;
  }
  const cov = S.coverage.find(c=>c.season===y);
  const weeks = S.matchups.filter(m=>m.season===y && !m.po && !m.bye && m.winner && m.winner!=='UNDECIDED');
  const byMp = {};
  weeks.forEach(m=>{ (byMp[m.mp]=byMp[m.mp]||[]).push(m); });
  /* weekly storylines: high score, blowout, nailbiter per week */
  const stories = Object.keys(byMp).sort((a,b)=>a-b).map(mp=>{
    const games = byMp[mp];
    let hiT=null, hiV=-1;
    games.forEach(m=>{ if(m.hs>hiV){hiV=m.hs; hiT=teamOf(y,m.h);} if(m.as_>hiV){hiV=m.as_; hiT=teamOf(y,m.a);} });
    const blow = [...games].sort((a,b)=>Math.abs(b.hs-b.as_)-Math.abs(a.hs-a.as_))[0];
    const close = [...games].filter(g=>Math.abs(g.hs-g.as_)>0).sort((a,b)=>Math.abs(a.hs-a.as_)-Math.abs(b.hs-b.as_))[0];
    const nm = m=>{ const w=m.winner==='HOME'; const wt=teamOf(y,w?m.h:m.a), lt=teamOf(y,w?m.a:m.h);
      return `${esc((wt||{}).name||'?')} <span class="dim">over</span> ${esc((lt||{}).name||'?')} <span class="num dim">${f1(Math.max(m.hs,m.as_))}–${f1(Math.min(m.hs,m.as_))}</span>`; };
    return `<div class="card" style="min-width:295px">
      <div class="kicker">Week ${mp}</div>
      <div class="small" style="margin-top:6px">💥 <b>${f1(hiV)}</b> — ${esc((hiT||{}).name||'?')}</div>
      ${blow?`<div class="small" style="margin-top:4px">🔨 by <b>${f1(Math.abs(blow.hs-blow.as_))}</b>: ${nm(blow)}</div>`:''}
      ${close&&close!==blow?`<div class="small" style="margin-top:4px">😱 by <b>${f1(Math.abs(close.hs-close.as_))}</b>: ${nm(close)}</div>`:''}
    </div>`;
  }).join('');
  const weekBlocks = Object.keys(byMp).sort((a,b)=>a-b).map(mp=>`
    <div class="card"><div class="kicker">Week ${mp}</div>${byMp[mp].map(m=>{
      const ht=teamOf(y,m.h), at=teamOf(y,m.a); const hw=m.winner==='HOME';
      return `<div class="mrow"><span style="flex:1" class="${hw?'':'dim'}">${esc(ht.name)}</span><b class="num">${f1(m.hs)}</b>
        <span class="dim">—</span><b class="num">${f1(m.as_)}</b><span style="flex:1;text-align:right" class="${hw?'dim':''}">${esc(at.name)}</span></div>`;
    }).join('')}</div>`).join('');
  app.innerHTML = `<div class="wrap">
    <div class="hero"><div class="kicker">${sd.leagueName?esc(sd.leagueName)+' · ':''}${sd.auction?'$200 auction':'snake draft'} · ${sd.teams.length} teams</div>
    <h1 class="display">${y} Season</h1>
    ${!sd.complete?'<p class="tag notice" style="margin-top:14px">Pre-draft planning field. Nothing here counts toward history yet.</p>':''}</div>
    <h2 class="sect">Final standings</h2>
    <div class="tblwrap"><table class="tbl"><thead><tr><th>Fin</th><th class="l">Team</th><th class="l">Owner</th><th>Record</th><th class="sortable">PF</th><th class="sortable">PA</th><th>Seed</th></tr></thead><tbody>${rows}</tbody></table></div>
    ${sd.complete?`<h2 class="sect">The race <span class="sub">cumulative points by week — hover to relive it</span></h2>
    ${chartBox('racechart', 380)}
    <h2 class="sect">Playoffs</h2>${bracket}
    <h2 class="sect">Draft <span class="sub">${sd.auction?'auction prices':'snake — no auction values (2014–2015)'}</span></h2>
    <p><a class="btn ghost" href="#/drafts/${y}">Open the ${y} draft board →</a></p>
    <h2 class="sect">Weekly storylines <span class="sub">high score · hammer · heartbreaker</span></h2>
    <div class="pill-scroll" style="align-items:stretch">${stories}</div>
    <h2 class="sect">Regular season results</h2><div class="grid g2">${weekBlocks}</div>
    ${y<2018?`<div class="notice" style="margin-top:20px">Evidence note: ${y} weekly lineups come from ESPN matchup rosters. Exact lineup slots and bench custody are unavailable before 2018${cov&&cov.unattributed>0?`, and ${f1(cov.unattributed)} team points across ${cov.gaps} team-weeks belong to since-removed players ESPN no longer lists`:''}. Nothing here is inferred.</div>`:''}`:''}
  </div>`;
  bindRows(); sortableTable(app);
  if(sd.complete) drawSeasonRace(y);
}

function draftsView(scope){
  const auctionYears = DONE.filter(y=>S.seasons[y].auction);

  const y = !allSeasons && scope && DONE.includes(scope) ? scope : auctionYears[auctionYears.length-1];
  const isAuction = !allSeasons && S.seasons[y].auction;
  const showScatter = allSeasons || isAuction;
  const picks = S.drafts.filter(d=>allSeasons ? DONE.includes(d.s) : d.s===y).sort((a,b)=>{
    if(allSeasons && a.s!==b.s) return b.s-a.s;
    const auction = S.seasons[a.s] && S.seasons[a.s].auction;
    return auction ? b.bid-a.bid : a.pick-b.pick;
  });
  const rows = picks.map(d=>{
    const rowAuction = S.seasons[d.s] && S.seasons[d.s].auction;
    const perDollar = rowAuction && d.bid>0 && d.par!=null ? d.par/d.bid : null;
    return `<tr>${allSeasons?`<td data-v="${d.s}">${d.s}</td>`:''}<td>${rowAuction?'$'+d.bid:('#'+d.pick)}</td>
    <td class="l">${plLink(d.eid)} ${posChip((PL[d.eid]||{}).pos)}</td>
    <td class="l">${frLink(d.fid, d.s)}</td>
    <td class="l">${d.keeper?'<span class="badge blue">keeper</span>':''}</td>
    <td data-v="${d.weeks}">${d.weeks}</td><td data-v="${d.starts}">${d.starts}</td>
    <td data-v="${d.pts}">${f1(d.pts)}</td>
    <td class="${cls(d.par)}" data-v="${d.par==null?-999:d.par}">${signed(d.par,f1)}</td>
    <td class="${cls(perDollar)}" data-v="${perDollar==null?-999:perDollar}">${perDollar==null?'·':f2(perDollar)}</td></tr>`;}).join('');
  const tabs = `<a class="chip ${allSeasons?'on':''}" href="#/drafts/all">All Seasons</a>`+
    DONE.map(yy=>`<a class="chip ${!allSeasons&&yy===y?'on':''}" href="#/drafts/${yy}">${yy}${S.seasons[yy].auction?'':' ⛓'}</a>`).join('');
  const allAuction = S.drafts.filter(d=>S.seasons[d.s] && S.seasons[d.s].auction && d.bid>0 && d.par!=null);
  const bestVal = [...allAuction].filter(d=>d.bid>=2).sort((a,b)=>b.par/b.bid-a.par/a.bid).slice(0,10);
  const busts = [...allAuction].filter(d=>d.bid>=30).sort((a,b)=>a.par-b.par).slice(0,10);
  const mini = d=>`<div class="mrow"><span class="k">${d.s} · $${d.bid}</span><span style="flex:1">${plLink(d.eid)} <span class="dim small">→ ${esc((F[d.fid]||{}).display_name)}</span></span><b class="num ${cls(d.par)}">${signed(d.par,f1)}</b></div>`;
  app.innerHTML = `<div class="wrap">
    <div class="hero"><div class="kicker">$200 auctions since 2016 · 2014–2015 were snake drafts (excluded from price analysis)</div>
    <h1 class="display">Draft Room</h1></div>
    <div class="pill-scroll" style="margin-bottom:14px">${tabs}</div>
    ${allSeasons?`<div class="notice" style="margin-bottom:14px">All ${picks.length} historical picks are listed below. Auction charts and PAR/$ use 2016–${auctionYears[auctionYears.length-1]} only; 2014–2015 remain visible as snake-draft picks with no invented prices.</div>`:
      (isAuction?'':`<div class="notice" style="margin-bottom:14px">${y} was a snake draft — bid amounts do not exist; value analysis uses auction seasons only (canon).</div>`)}
    ${showScatter?`<h2 class="sect" style="margin-top:0">Price vs. payoff <span class="sub">${allSeasons?`${auctionYears[0]}–${auctionYears[auctionYears.length-1]} · all auction seasons combined`:`${y} · every dollar against the PAR it bought`}</span></h2>
    ${chartBox('draftscatter', 380)}
    <p class="dim small" style="margin:6px 0 18px">Up and left is a steal; down and right is a bust. Hover any dot. Draft PAR is par_v1 — points delivered to the drafting franchise above a replacement start.</p>`:''}
    <div class="tblwrap"><table class="tbl"><thead><tr>${allSeasons?'<th class="sortable">Season</th>':''}<th>${allSeasons?'Price / Pick':(isAuction?'Price':'Pick')}</th><th class="l">Player</th><th class="l">Franchise</th><th class="l"></th>
      <th class="sortable">Wks</th><th class="sortable">Starts</th><th class="sortable">Pts for them</th><th class="sortable">Draft PAR</th><th class="sortable">PAR/$</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="grid g2" style="margin-top:26px">
      <div class="card"><div class="kicker">Best auction values, all-time (min $2)</div>${bestVal.map(mini).join('')}</div>
      <div class="card"><div class="kicker">Costliest busts, all-time (min $30)</div>${busts.map(mini).join('')}</div>
    </div>
    <h2 class="sect">Where the money goes <span class="sub">auction spend share by position, every draft since 2016</span></h2>
    ${chartBox('spendmix', 300)}
    <p class="dim small" style="margin-top:14px">Draft PAR (par_v1): AFFL points delivered to the drafting franchise while rostered, minus replacement-level points for the position over those weeks. Replacement baselines per season are listed in <a href="#/methods">Methodology</a>.</p>

/* ---------------- RECORDS ---------------- */
function heatColor(rank, n){
  if(rank==null || !n || n<2) return 'transparent';
  const t = (rank-1)/(n-1);                    // 0 best -> 1 worst
  const hue = 145 - t*145;                     // green -> red
  return `hsla(${hue},70%,45%,0.55)`;
}
function rankHeatBlock(year){
  const rh = (L.rankHeat||[]).find(x=>x.s===year);
  if(!rh) return '';
  const sd = S.seasons[year]||{teams:[]};
  const rankOf = fid => { const t = sd.teams.find(t=>t.fid===fid); return t? (t.finalRank||99) : 99; };
  const teams = [...rh.teams].sort((a,b)=>rankOf(a.fid)-rankOf(b.fid));
  const head = `<tr><th class="l stick">Team</th>${rh.weeks.map(w=>`<th>${w}</th>`).join('')}<th title="mean weekly rank">Avg</th></tr>`;
  const body = teams.map(t=>{
    const cells = t.ranks.map((rk,i)=>{
      const n = rh.n[i];
      const sc = (t.scores||[])[i];
      return `<td class="heatc" style="background:${heatColor(rk,n)}" title="${year} Wk ${rh.weeks[i]} · ${esc(histName(year,t.fid))}${sc!=null?' · '+f1(sc)+' pts':''} · rank ${rk==null?'—':rk}/${n}">${rk==null?'·':rk}</td>`;
    }).join('');
    const known = t.ranks.filter(x=>x!=null);
    const avg = known.length? known.reduce((a,b)=>a+b,0)/known.length : null;
    return `<tr><td class="l stick">${frLink(t.fid,year)}</td>${cells}<td class="num"><b>${avg!=null?avg.toFixed(1):'·'}</b></td></tr>`;
  }).join('');
  return `<div class="tblwrap mtx"><table class="tbl mono heat"><thead>${head}</thead><tbody>${body}</tbody></table></div>
  <p class="dim small" style="margin-top:8px">Each cell is that team's <b>scoring rank inside the week</b> (1 = highest score in the league that week), regular season only — the schedule-free view of who actually showed up, week by week. Rows ordered by final standing.</p>`;
}
